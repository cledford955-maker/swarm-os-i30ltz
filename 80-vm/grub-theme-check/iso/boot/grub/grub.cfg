insmod all_video
insmod png
loadfont /boot/grub/cachyos/menu.pf2
set gfxmode=1920x1080
terminal_output gfxterm
set theme=/boot/grub/cachyos/theme.txt
set timeout=-1
menuentry 'CachyOS' --class cachyos { true; }
menuentry 'SWARM OS' --class swarm_os { true; }
menuentry 'EndeavourOS' --class endeavouros { true; }
menuentry 'Ventoy' --class ventoy { true; }
