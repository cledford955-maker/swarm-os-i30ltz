LABEL arch
TEXT HELP
Boot the Arch Linux install medium on BIOS.
It allows you to install Arch Linux or perform system maintenance.
ENDTEXT
MENU LABEL Arch Linux install medium (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID%

# Accessibility boot option
LABEL archspeech
TEXT HELP
Boot the Arch Linux install medium on BIOS with speakup screen reader.
It allows you to install Arch Linux or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL Arch Linux install medium (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on

# ── SWARM OS Safe Mode (au3, added 2026-09-12 · v1.0.0) ─────────────────────
LABEL swarmsafe
TEXT HELP
Boot SWARM OS to a plain text console with every SWARM service masked.
Use this when the kiosk shell will not start. tty1 autologins as swarm.
ENDTEXT
MENU LABEL Swarm OS Safe Mode (text console, services o^ff)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% systemd.unit=multi-user.target systemd.mask=swarm-ui.service systemd.mask=lucy-server.service systemd.mask=gaming-agent.service systemd.mask=google-workspace.service systemd.mask=swarm-secrets.service systemd.mask=lucille-ai-sync.timer systemd.mask=swarm-podman-linger.service loglevel=4 apparmor=0 console=ttyS0,115200 console=tty0

LABEL swarmsafenokms
TEXT HELP
Same as Safe Mode, plus nomodeset. Use when the screen is blank or garbled
because kernel mode setting is failing on this GPU.
ENDTEXT
MENU LABEL Swarm OS Safe Mode + ^no KMS (blank/garbled screen)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% systemd.unit=multi-user.target systemd.mask=swarm-ui.service systemd.mask=lucy-server.service systemd.mask=gaming-agent.service systemd.mask=google-workspace.service systemd.mask=swarm-secrets.service systemd.mask=lucille-ai-sync.timer systemd.mask=swarm-podman-linger.service nomodeset loglevel=4 apparmor=0 console=ttyS0,115200 console=tty0
