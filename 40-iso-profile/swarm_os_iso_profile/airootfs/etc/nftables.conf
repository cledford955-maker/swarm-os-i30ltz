#!/usr/bin/nft -f
# =============================================================================
# 🚀 SWARM OS — High-Security nftables Firewall Configuration
# Drops external ingress on RPC (9091) and gRPC (50051) while allowing lo and tailscale0
# =============================================================================

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        # 1. Allow all loopback traffic
        iif "lo" accept

        # 2. Allow established and related connections
        ct state established,related accept
        ct state invalid drop

        # 3. Allow ICMP / ping
        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept

        # 4. Allow all traffic on Tailscale mesh VPN
        iif "tailscale0" accept

        # 5. Explicitly drop external access to internal AI/RPC ports on non-tailscale interfaces
        tcp dport { 9091, 50051 } drop
        udp dport { 9091, 50051 } drop

        # 6. Allow SSH only from the trusted Tailscale mesh.
        # Accepting SSH from the open internet is unnecessary: every device on
        # the tailnet can reach this machine, and tailscale itself is
        # cryptographically authenticated end-to-end. Removing the public-SSH
        # surface eliminates brute-force exposure entirely.
        iif "tailscale0" tcp dport 22 accept

        # 7. Reject other unsolicited incoming connections
        reject with icmpx type port-unreachable
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
        iif "tailscale0" accept
        oif "tailscale0" accept
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
