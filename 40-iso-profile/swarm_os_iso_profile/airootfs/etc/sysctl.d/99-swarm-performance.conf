# =============================================================================
# 🚀 SWARM OS — High-Performance Kernel & Memory Sysctl Tuning
# =============================================================================

# Memory & Dirty Page Ratios
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5
vm.vfs_cache_pressure = 50

# Transparent Hugepages (madvise for optimal allocation without latency spikes)
vm.transparent_hugepage = madvise

# File descriptor limits
fs.file-max = 2097152

# Swappiness Tuning (Optimal 80-100 balance for ZRAM)
vm.swappiness = 80
vm.page-cluster = 0

# File system inotify limits for AI agents & build watchers
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024
