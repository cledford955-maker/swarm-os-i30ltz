[Login]
# SWARM OS Seat & Session Management
# Allocates seat0 to non-root runtime user on autologin with persistent graphical capability
NAutoVTs=6
# tty1 belongs to swarm-ui. ReserveVT unconditionally starts a text getty,
# even on an occupied VT, so reserving tty1 hangs up the graphical session.
# Keep the recovery console on the standard Ctrl+Alt+F6 terminal instead.
ReserveVT=6
KillUserProcesses=no
HandlePowerKey=poweroff
HandleSuspendKey=ignore
HandleHibernateKey=ignore
HandleLidSwitch=ignore
SessionsMax=8192
InhibitorsMax=8192
