# SWARM OS — Podman rootless container registries (Task #2)
# Minimal, explicit config: only resolve short image names against Docker
# Hub. Leaving this list empty makes podman prompt interactively for every
# unqualified pull, which breaks non-interactive use (dev-container tooling
# launched from LucyServer/alacritty).
unqualified-search-registries = ["docker.io"]

[[registry]]
location = "docker.io"
