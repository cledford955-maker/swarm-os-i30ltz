# SWARM OS — Podman rootless storage (Task #2)
# Rootless podman on a modern kernel (native overlay + userxattr) doesn't need
# fuse-overlayfs, but we install it anyway as the portable fallback for
# kernels/configs where unprivileged overlay mounts are restricted.
[storage]
driver = "overlay"

[storage.options]
mount_program = "/usr/bin/fuse-overlayfs"

[storage.options.overlay]
mountopt = "nodev,metacopy=on"
