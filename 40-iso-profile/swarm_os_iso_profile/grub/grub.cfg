# Load partition table and file system modules
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod ntfs
insmod ntfscomp
insmod exfat
insmod udf

# Use graphics-mode output
if loadfont "${prefix}/fonts/unicode.pf2" ; then
    insmod all_video
    set gfxmode="auto"
    set theme="${prefix}/themes/swarm_os/theme.txt"
    export theme
    terminal_input console
    terminal_output gfxterm
fi

# Enable serial console
insmod serial
insmod usbserial_common
insmod usbserial_ftdi
insmod usbserial_pl2303
insmod usbserial_usbdebug
if serial --unit=0 --speed=115200; then
    terminal_input --append serial
    terminal_output --append serial
fi

# Get a human readable platform identifier
if [ "${grub_platform}" == 'efi' ]; then
    archiso_platform='UEFI'
elif [ "${grub_platform}" == 'pc' ]; then
    archiso_platform='BIOS'
else
    archiso_platform="${grub_cpu}-${grub_platform}"
fi

# Set default menu entry
default=swarm-live
timeout=10
timeout_style=menu


# Menu entries

menuentry "Swarm OS — Live Kiosk (default)" --class swarm-live --class swarm --class gnu-linux --id 'swarm-live' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet loglevel=3 i915.enable_psr=0 i915.enable_dc=0 systemd.unit=graphical.target console=tty0 console=ttyS0,115200
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "Swarm OS — Install to Disk" --class swarm-install --class swarm --class gnu-linux --id 'swarm-install' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% i915.enable_psr=0 i915.enable_dc=0 systemd.unit=multi-user.target systemd.mask=swarm-ui.service console=tty0
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

# ── Safe Mode (au3, added 2026-09-12 · v1.0.0) ───────────────────────────────
# When the kiosk shell will not come up, this is the way back in. Boots to a
# plain text console with every SWARM service masked, so a failing unit cannot
# take the console with it. tty1 autologins as `swarm`; sudo is available.
#   Logs:     journalctl -b -u swarm-ui.service
#   Re-try:   sudo systemctl unmask swarm-ui.service && sudo systemctl start swarm-ui.service

menuentry "Swarm OS — Safe Mode (text console, services off)" --hotkey f --class swarm-safe --class swarm --class recovery --class gnu-linux --id 'swarm-safe' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% systemd.unit=multi-user.target systemd.mask=swarm-ui.service systemd.mask=lucy-server.service systemd.mask=gaming-agent.service systemd.mask=google-workspace.service systemd.mask=i30ltz-recovery.service systemd.mask=swarm-secrets.service systemd.mask=lucille-ai-sync.timer systemd.mask=swarm-podman-linger.service loglevel=4 apparmor=0 console=ttyS0,115200 console=tty0
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "Swarm OS — Safe Mode + no KMS (blank/garbled screen)" --class swarm-safe-nomodeset --class swarm --class recovery --class gnu-linux --id 'swarm-safe-nomodeset' {
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% systemd.unit=multi-user.target systemd.mask=swarm-ui.service systemd.mask=lucy-server.service systemd.mask=gaming-agent.service systemd.mask=google-workspace.service systemd.mask=i30ltz-recovery.service systemd.mask=swarm-secrets.service systemd.mask=lucille-ai-sync.timer systemd.mask=swarm-podman-linger.service nomodeset loglevel=4 apparmor=0 console=ttyS0,115200 console=tty0
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "Arch Linux install medium (%ARCH%, ${archiso_platform})" --class arch --class gnu-linux --class gnu --class os --id 'archlinux' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "Arch Linux install medium with speakup screen reader (%ARCH%, ${archiso_platform})" --hotkey s --class arch --class gnu-linux --class gnu --class os --id 'archlinux-accessibility' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}


if [ "${grub_platform}" == 'efi' -a "${grub_cpu}" == 'x86_64' -a -f '/boot/memtest86+/memtest.efi' ]; then
    menuentry 'Run Memtest86+ (RAM test)' --class memtest86 --class memtest --class gnu --class tool {
        set gfxpayload=800x600,1024x768
        linux /boot/memtest86+/memtest.efi
    }
fi
if [ "${grub_platform}" == 'pc' -a -f '/boot/memtest86+/memtest' ]; then
    menuentry 'Run Memtest86+ (RAM test)' --class memtest86 --class memtest --class gnu --class tool {
        set gfxpayload=800x600,1024x768
        linux /boot/memtest86+/memtest
    }
fi
if [ "${grub_platform}" == 'efi' ]; then
    menuentry "CachyOS (chainload)" --class cachyos --class gnu-linux --class os --id 'cachyos-chainload' {
        search --no-floppy --fs-uuid --set=root A367-87E3
        chainloader /EFI/cachyos/grubx64.efi
    }

    if [ "${grub_cpu}" == 'x86_64' -a -f '/shellx64.efi' ]; then
        menuentry 'UEFI Shell' --class efi {
            chainloader /shellx64.efi
        }
    elif [ "${grub_cpu}" == 'i386' -a -f '/shellia32.efi' ]; then
        menuentry 'UEFI Shell' --class efi {
            chainloader /shellia32.efi
        }
    elif [ "${grub_cpu}" == 'arm64' -a -f '/shellaa64.efi' ]; then
        menuentry 'UEFI Shell' --class efi {
            chainloader /shellaa64.efi
        }
    elif [ "${grub_cpu}" == 'riscv64' -a -f '/shellriscv64.efi' ]; then
        menuentry 'UEFI Shell' --class efi {
            chainloader /shellriscv64.efi
        }
    elif [ "${grub_cpu}" == 'loongarch64' -a -f '/shellloongarch64.efi' ]; then
        menuentry 'UEFI Shell' --class efi {
            chainloader /shellloongarch64.efi
        }
    fi

    menuentry 'UEFI Firmware Settings' --id 'uefi-firmware' {
        fwsetup
    }
fi

menuentry 'System shutdown' --class shutdown --class poweroff {
    echo 'System shutting down...'
    halt
}

menuentry 'System restart' --class reboot --class restart {
    echo 'System rebooting...'
    reboot
}


# GRUB init tune for accessibility
play 600 988 1 1319 4
