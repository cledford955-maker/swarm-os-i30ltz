# Lucille Companion — Version Catalog  v1.0.0  2026-09-24
[versions]
agp                 = "8.7.0"
kotlin              = "2.0.21"
coreKtx             = "1.13.1"
composeBom          = "2024.09.00"
activityCompose     = "1.9.2"
navigationCompose   = "2.8.0"
lifecycleVm         = "2.8.6"
datastore           = "1.1.1"
okhttp              = "4.12.0"
gson                = "2.11.0"
coroutines          = "1.9.0"
coil                = "2.7.0"

[libraries]
# Core
androidx-core-ktx           = { group = "androidx.core",       name = "core-ktx",                  version.ref = "coreKtx" }
# Compose BOM (controls all compose-* versions)
compose-bom                 = { group = "androidx.compose",    name = "compose-bom",               version.ref = "composeBom" }
compose-ui                  = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling-preview  = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling          = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-material3           = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons      = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-runtime             = { group = "androidx.compose.runtime", name = "runtime" }
# Activity
activity-compose            = { group = "androidx.activity",   name = "activity-compose",          version.ref = "activityCompose" }
# Navigation
navigation-compose          = { group = "androidx.navigation", name = "navigation-compose",         version.ref = "navigationCompose" }
# Lifecycle / ViewModel
lifecycle-viewmodel-compose = { group = "androidx.lifecycle",  name = "lifecycle-viewmodel-compose", version.ref = "lifecycleVm" }
lifecycle-runtime-ktx       = { group = "androidx.lifecycle",  name = "lifecycle-runtime-ktx",     version.ref = "lifecycleVm" }
# DataStore
datastore-preferences       = { group = "androidx.datastore", name = "datastore-preferences",      version.ref = "datastore" }
# Networking
okhttp                      = { group = "com.squareup.okhttp3", name = "okhttp",                   version.ref = "okhttp" }
gson                        = { group = "com.google.code.gson", name = "gson",                     version.ref = "gson" }
# Coroutines
kotlinx-coroutines-android  = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
# Image loading
coil-compose                = { group = "io.coil-kt",          name = "coil-compose",              version.ref = "coil" }

[plugins]
android-application     = { id = "com.android.application",             version.ref = "agp" }
kotlin-android          = { id = "org.jetbrains.kotlin.android",        version.ref = "kotlin" }
kotlin-compose          = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization    = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
