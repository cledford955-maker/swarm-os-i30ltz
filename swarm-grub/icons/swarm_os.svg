<?xml version="1.0" encoding="UTF-8"?>
<!-- swarm-grub icon: SWARM OS: wasp in a hex cell (menu class "swarm_os"). 128x128 art, rendered at 64x64.
     Shared medallion: metal rim, dark glass face, neon ring + glyph in #ffb020. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="rim" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#b4c0da"/><stop offset="0.5" stop-color="#3a465e"/><stop offset="1" stop-color="#0c111b"/>
    </linearGradient>
    <radialGradient id="face" cx="0.45" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#1b2740"/><stop offset="0.7" stop-color="#0a101c"/><stop offset="1" stop-color="#04070d"/>
    </radialGradient>
    <radialGradient id="aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.62" stop-color="#ffb020" stop-opacity="0"/><stop offset="1" stop-color="#ffb020" stop-opacity="0.5"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="64" cy="64" r="62" fill="url(#rim)"/>
  <circle cx="64" cy="64" r="57" fill="url(#face)"/>
  <circle cx="64" cy="64" r="57" fill="url(#aura)"/>
  <circle cx="64" cy="64" r="54.5" fill="none" stroke="#ffb020" stroke-width="2.2" opacity="0.9"/>
  <g filter="url(#glow)" fill="none" stroke="#ffb020" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="64.0,23.0 99.5,43.5 99.5,84.5 64.0,105.0 28.5,84.5 28.5,43.5" stroke-width="5.5"/>
    <g stroke="none">
      <ellipse cx="50" cy="52" rx="7" ry="13" transform="rotate(-38 50 52)" fill="#cfeaff" opacity="0.85"/>
      <ellipse cx="78" cy="52" rx="7" ry="13" transform="rotate(38 78 52)" fill="#cfeaff" opacity="0.85"/>
      <ellipse cx="64" cy="72" rx="10" ry="17" fill="#ffb020"/>
      <rect x="52" y="66" width="24" height="4.2" fill="#140d02"/>
      <rect x="52" y="75" width="24" height="4.2" fill="#140d02"/>
      <circle cx="64" cy="49" r="6.5" fill="#ffb020"/>
    </g>
    <path d="M60 44 L55 36 M68 44 L73 36" stroke-width="2.6"/>
  </g>
  <ellipse cx="64" cy="34" rx="40" ry="24" fill="url(#gloss)"/>
</svg>
