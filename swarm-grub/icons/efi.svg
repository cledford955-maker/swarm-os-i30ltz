<?xml version="1.0" encoding="UTF-8"?>
<!-- swarm-grub icon: UEFI firmware setup: chip (menu class "efi"). 128x128 art, rendered at 64x64.
     Shared medallion: metal rim, dark glass face, neon ring + glyph in #18e0c0. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="rim" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#b4c0da"/><stop offset="0.5" stop-color="#3a465e"/><stop offset="1" stop-color="#0c111b"/>
    </linearGradient>
    <radialGradient id="face" cx="0.45" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#1b2740"/><stop offset="0.7" stop-color="#0a101c"/><stop offset="1" stop-color="#04070d"/>
    </radialGradient>
    <radialGradient id="aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.62" stop-color="#18e0c0" stop-opacity="0"/><stop offset="1" stop-color="#18e0c0" stop-opacity="0.5"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="64" cy="64" r="62" fill="url(#rim)"/>
  <circle cx="64" cy="64" r="57" fill="url(#face)"/>
  <circle cx="64" cy="64" r="57" fill="url(#aura)"/>
  <circle cx="64" cy="64" r="54.5" fill="none" stroke="#18e0c0" stroke-width="2.2" opacity="0.9"/>
  <g filter="url(#glow)" fill="none" stroke="#18e0c0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="40" y="40" width="48" height="48" rx="7" stroke-width="6"/>
    <rect x="53" y="53" width="22" height="22" rx="3" fill="#18e0c0" stroke-width="2"/>
    <path d="M50 30 V40 M50 88 V98 M30 50 H40 M88 50 H98" stroke-width="4.5"/>
    <path d="M64 30 V40 M64 88 V98 M30 64 H40 M88 64 H98" stroke-width="4.5"/>
    <path d="M78 30 V40 M78 88 V98 M30 78 H40 M88 78 H98" stroke-width="4.5"/>
  </g>
  <ellipse cx="64" cy="34" rx="40" ry="24" fill="url(#gloss)"/>
</svg>
