name: swarm_flutter
description: SWARM OS Native Linux Desktop Shell & Honeycomb Agent UI
publish_to: 'none'
version: 6.2.89+89

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  provider: ^6.1.1
  go_router: ^14.8.1
  http: ^1.3.0
  web_socket_channel: ^3.0.2
  icons_plus: ^5.0.0
  shared_preferences: ^2.5.3
  google_fonts: ^6.2.1
  collection: ^1.19.1
  intl: ^0.20.2
  uuid: ^4.5.1
  window_manager: ^0.5.2
  file_picker: ^12.0.0
  crypto: ^3.0.5
  cryptography: ^2.7.0
  audioplayers: ^5.1.0
  video_player: ^2.14.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_linux: ^1.2.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.15
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.3

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icons/
    - assets/wallpapers/
    - assets/companion/
    - assets/splash/