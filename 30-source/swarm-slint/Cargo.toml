[package]
name = "swarm-slint"
version = "6.2.88"
edition = "2021"

[[bin]]
name = "swarm-slint"
path = "src/main.rs"

[dependencies]
# winit backend — Wayland client mode. Runs under labwc compositor on the ISO.
# For dev: WAYLAND_DISPLAY=wayland-1 (or whatever your compositor exposes) just works.
slint = { version = "1", features = ["backend-winit", "renderer-skia-opengl", "renderer-femtovg"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }

[build-dependencies]
slint-build = "1"
