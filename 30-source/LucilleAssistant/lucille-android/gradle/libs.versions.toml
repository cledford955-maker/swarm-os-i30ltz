[versions]
agp              = "8.5.2"
kotlin           = "2.0.20"
compose-bom      = "2024.09.03"
compose-nav      = "2.8.3"
lifecycle        = "2.8.7"
activity-compose = "1.9.3"
coroutines       = "1.9.0"
serialization    = "1.7.3"
okhttp           = "4.12.0"
coil             = "2.7.0"

[libraries]
# Compose BOM
compose-bom       = { group = "androidx.compose",   name = "compose-bom",            version.ref = "compose-bom" }
compose-ui        = { group = "androidx.compose.ui", name = "ui" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-tooling   = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-tooling-d = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-icons     = { group = "androidx.compose.material", name = "material-icons-extended" }

# Navigation + lifecycle
nav-compose       = { group = "androidx.navigation", name = "navigation-compose",    version.ref = "compose-nav" }
lifecycle-runtime = { group = "androidx.lifecycle",  name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-compose = { group = "androidx.lifecycle",  name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
activity-compose  = { group = "androidx.activity",   name = "activity-compose",      version.ref = "activity-compose" }

# Coroutines
coroutines-core   = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core",    version.ref = "coroutines" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Serialization
serialization     = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

# Network
okhttp            = { group = "com.squareup.okhttp3", name = "okhttp",                      version.ref = "okhttp" }

# Image loading (avatar)
coil-compose      = { group = "io.coil-kt",           name = "coil-compose",               version.ref = "coil" }

[plugins]
android-application = { id = "com.android.application",              version.ref = "agp"    }
kotlin-android      = { id = "org.jetbrains.kotlin.android",         version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose",  version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
